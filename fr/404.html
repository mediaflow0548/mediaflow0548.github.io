<!DOCTYPE html>
<!-- ==================================================================
     Mediaflow - 404 (pagina niet gevonden, Frans)
     ------------------------------------------------------------------
     Deze pagina wordt gebruikt als een bezoeker een verkeerde URL
     intypt binnen het Franse gedeelte van de website. De header en
     footer worden automatisch ingevuld door script.js.
     ================================================================== -->
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page introuvable | Mediaflow</title>
    <meta name="description" content="La page demandée n'existe pas ou a été déplacée. Retournez à la page d'accueil de Mediaflow.">
    <link rel="icon" type="image/png" href="../assets/favicon.png">
    <link rel="stylesheet" href="../style.css">
    <meta property="og:title" content="Page introuvable | Mediaflow">
    <meta property="og:description" content="La page demandée n'existe pas ou a été déplacée. Retournez à la page d'accueil de Mediaflow.">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Mediaflow">
    <meta property="og:image" content="https://mediaflow.spakman.nl/assets/logo.png">
    <meta name="twitter:card" content="summary_large_image">
</head>
<body>
    <header class="site-header"></header>
    <main class="error-page">
        <h1>404</h1>
        <p>Cette page n'existe pas ou a été déplacée.</p>
        <a href="index.html" class="btn btn-primary">Retour à l'accueil</a>
    </main>
    <footer class="site-footer"></footer>
    <script src="../script.js" defer></script>
</body>
</html>
