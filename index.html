<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mediaflow | Professionele Media & Design</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #111b21; /* Prachtige donkere achtergrond */
            color: #ffffff; /* Witte letters */
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            text-align: center;
        }

        .container {
            max-width: 600px;
            padding: 20px;
        }

        h1 {
            font-size: 3.5rem;
            margin-bottom: 10px;
            color: #00a884; /* Mooie frisse groen/blauwe accentkleur */
            letter-spacing: 1px;
        }

        p {
            font-size: 1.3rem;
            color: #8696a0; /* Iets zachtere kleur voor de subtekst */
            margin-bottom: 30px;
            line-height: 1.6;
        }

        .btn {
            display: inline-block;
            background-color: #00a884;
            color: white;
            padding: 14px 28px;
            text-decoration: none;
            border-radius: 25px;
            font-weight: bold;
            font-size: 1.1rem;
            transition: 0.3s;
            box-shadow: 0 4px 15px rgba(0, 168, 132, 0.3);
        }

        .btn:hover {
            background-color: #008f72;
            transform: scale(1.05);
            box-shadow: 0 6px 20px rgba(0, 168, 132, 0.5);
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Mediaflow</h1>
        <p>Wij bouwen aan een gloednieuwe digitale ervaring. Onze website is momenteel in aanbouw.</p>
        <a href="mailto:mediaflow0548@outlook.com" class="btn">Neem contact op</a>
    </div>

</body>
</html>
