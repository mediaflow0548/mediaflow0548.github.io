<!DOCTYPE html>
<!-- ==================================================================
     Mediaflow - 404 (pagina niet gevonden, Duits)
     ------------------------------------------------------------------
     Deze pagina wordt gebruikt als een bezoeker een verkeerde URL
     intypt binnen het Duitse gedeelte van de website. De header en
     footer worden automatisch ingevuld door script.js.
     ================================================================== -->
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seite nicht gefunden | Mediaflow</title>
    <meta name="description" content="Die aufgerufene Seite existiert nicht oder wurde verschoben. Zurück zur Startseite von Mediaflow.">
    <link rel="icon" type="image/png" href="../assets/favicon.png">
    <link rel="stylesheet" href="../style.css">
    <meta property="og:title" content="Seite nicht gefunden | Mediaflow">
    <meta property="og:description" content="Die aufgerufene Seite existiert nicht oder wurde verschoben. Zurück zur Startseite von Mediaflow.">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Mediaflow">
    <meta property="og:image" content="https://mediaflow.spakman.nl/assets/logo.png">
    <meta name="twitter:card" content="summary_large_image">
</head>
<body>
    <header class="site-header"></header>
    <main class="error-page">
        <h1>404</h1>
        <p>Diese Seite existiert nicht oder wurde verschoben.</p>
        <a href="index.html" class="btn btn-primary">Zurück zur Startseite</a>
    </main>
    <footer class="site-footer"></footer>
    <script src="../script.js" defer></script>
</body>
</html>
